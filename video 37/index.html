<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }

        header{
            position: sticky;
            top: 0;
        }
        
        nav{
            background-color: pink;
            height: 100px;
            width: 100vw;
            
        }

        .container{
            background-color: green;
            height: 550px;
            width: 90vw;
            text-align: center;
            padding: 55px 23px;
            margin: 12px 20px;
        }

        .box1{
            height: 530px;
            width: 40vw;
            background-color: aliceblue;
            display: inline-block;
            margin: 0 18px;
        }

        .box2{
            height: 530px;
            width: 40vw;
            background-color: yellowgreen;
            display: inline-block;
            margin: 0 18px;
        }

        footer{
            height: 100px;
            background-color: bisque;
        }

        .text-box{
            padding: 34px;
            border: 2px solid white;
            margin: 50px 34vw;
            font-size: 2em;
            border-radius: 43px;
        }

        main{
            background-color: black;
            color: white;
            padding: 34px;
        }

        .orange-box{
            height: 32px;
            width: 32px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 23px;
            border-radius: 60px;
        }

    </style>
</head>
<body>
    <header>
        <nav></nav>


    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text-box">
            <p>Welcome to sigma web development course</p>
        </div>

        <div class="orange-box"></div>
        


    </main>

    <footer>


    </footer>
</body>
</html>
