<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buisness Name generator</title>
</head>

<body>
    <script>
        let rand = Math.random()
        let first, second, third

        //Generates the first word
        if (rand < 0.33) {
            first = "Crazy"
        }
        else if (rand >= 0.33 && rand < 0.66) {
            first = "Amazing"
        }
        else {
            first = "Fire"
        }

        //Generates the second word
        rand = Math.random()
        if (rand < 0.33) {
            second = "Engine"
        }
        else if (rand >= 0.33 && rand < 0.66) {
            second = "Foods"
        }
        else {
            second = "Garments"
        }

        //Generates the third word
        rand = Math.random()
        if (rand < 0.33) {
            third = "Bros"
        }
        else if (rand >= 0.33 && rand < 0.66) {
            third = "Limited"
        }
        else {
            third = "Hub"
        }
    </script>

</body>

</html>
