<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Position</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .box {
            border: 2px solid black;
            width: 80vw;
            height: 410px;
            margin: 3px;
            padding: 3px;
        }

        .box1 {
            /* position: sticky; */
            /* top: 0px; */
            background-color: aliceblue; */
            height: 130px;
            width: 90%;
            /* margin: 0; */
            /* padding: 0; */
            position: absolute;
            top: 0px;
            left: 2px;
            /* Relative to nearest position ancestor */
        }

        .box2 {
            background-color: yellow;
            /* position: relative; */
            /* top: 34px;
            left: 56px; */
        }

        .box3 {
            background-color: aquamarine;
            /* position: fixed; */
            /* bottom: 0px; */
            left:6vw;
            height: 111px; 
        }

        .box4 {
            background-color: blue;
        }

        .parent {
            padding: 43px;
            margin: 34px;
            border: 3px solid red;
            /*Exception : transform,filter and persective properties can also make an element appear as positioned */
            /* transform: translate(0); */
            /* filter: invert(0); */
            /* position: sticky; */
            perspective: 0em;
        }
    </style>
</head>

<body>
    <div class="parent">
        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>


</body>

</html>
