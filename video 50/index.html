<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Filters</title>
    <style>
        /* img{
            filter: blur(10px);
        } */
        .img1 {
            filter: brightness(122%)
            contrast(3);
        }
        .img2 {
            /* filter: contrast(1); */
            /* filter: invert(1); */
            filter: opacity(0.8);  
            /* IF ITEMS ARE OVERLAPPED USING CSS GRID THEN THE IMAGE BELOW CAN BE SEEN WITH THE HELP OF OPACITY */
        }
        .img3 {
            filter: grayscale(20%);
            /* filter: sepia(50%); */
        }

    </style>
</head>
<body>
    <div class="container">
        <img class="img1" src="https://img.freepik.com/free-photo/programming-background-with-person-working-with-codes-computer_23-2150010125.jpg?size=626&ext=jpg" alt="" srcset="">
        <img class="img2" src="https://c.ndtvimg.com/2023-09/154fgjlg_shah-rukh-khan-_625x300_23_September_23.jpg" alt="" srcset="">
        <img class="img3" src="https://images.hindustantimes.com/img/2022/11/12/550x309/akshay_kumar_1659860706633_1668255913307_1668255913307.jpg" alt="" srcset="">
    </div>
    
</body>
</html>
