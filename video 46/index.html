<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        .container{
            background-color: rgb(15, 61, 61);
            height: 80vh;
            width: 30vw;
        }

        .box{
            width: 34px;
            height: 45px;
            /* background-color: rgb(105, 174, 174); */
            /* animation-name: ayushKaAnimation;
            animation-duration: 1s;
            animation-iteration-count: infinite;
            animation-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1); */
            display: flex;
            justify-content: center;
            align-items: center;
            /* animation-delay: 1s;
            /* animation-direction: reverse; */
            /* animation-play-state: running;  */
            /* animation: name duration timing-function delay iteration-count direction fill-mode; */
            animation: ayushKaAnimation 3s ease-in-out 2s alternate-reverse backwards;
            animation: ayush2 2s ease-in 1s alternate-reverse forwards;

        @keyframes ayushKaAnimation {
            from{
                background-color: red;

            }
            to{
                /* transform: translateX(1000px); */
                background-color: yellow;
            }
            
        }

        @keyframes ayush2 {
            0%{
                transform: rotate(100deg);
            }
            20%{
                transform: rotate(200deg);
            }
            50%{
                transform: rotate(220deg);
            }
            80%{
                transform: rotate(300deg);
            }
            100%{
                transform: rotate(310deg);
            }
            
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            Box
        </div>
    </div>
    
</body>
</html>
